<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>icon</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { background: #08090b; }
  .icon { position: relative; overflow: hidden; background: #08090b; }
  .icon svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="icon" id="icon">
  <img src="masters/app-icon.png" alt="Creator Football CF crest" style="display:block;width:100%;height:100%" />
</div>
<script>
  const p = new URLSearchParams(location.search);
  const size = Number(p.get('size') || 192);
  const radius = Number(p.get('radius') || 0);
  const el = document.getElementById('icon');
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.style.borderRadius = radius + 'px';
  document.body.style.width = size + 'px';
  document.body.style.height = size + 'px';
</script>
</body>
</html>
