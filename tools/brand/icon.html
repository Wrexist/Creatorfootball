<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>icon</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { background: #08090b; }
  .icon { position: relative; overflow: hidden; background: #08090b; }
  .icon svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="icon" id="icon">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <linearGradient id="b" x1="0.18" y1="0.05" x2="0.82" y2="0.98">
        <stop offset="0%" stop-color="#e6ff9b" />
        <stop offset="38%" stop-color="#c8ff2e" />
        <stop offset="100%" stop-color="#9ecc12" />
      </linearGradient>
      <radialGradient id="s" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="g" cx="0.5" cy="0.42" r="0.62">
        <stop offset="0%" stop-color="#12160e" />
        <stop offset="100%" stop-color="#08090b" />
      </radialGradient>
    </defs>
    <rect width="64" height="64" fill="url(#g)" />
    <circle cx="32" cy="32" r="21.5" fill="url(#b)" />
    <ellipse cx="24.5" cy="22.5" rx="12" ry="8" transform="rotate(-32 24.5 22.5)" fill="url(#s)" />
    <g fill="#0d1400" stroke="#0d1400" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32.00 24.60 L39.04 29.71 L36.35 37.99 L27.65 37.99 L24.96 29.71 Z" stroke-width="1.2" />
      <path fill="none" stroke-width="2.9" d="M39.42 29.59 L49.16 26.42 M36.58 38.31 L42.60 46.60 M27.42 38.31 L21.40 46.60 M24.58 29.59 L14.84 26.42" />
    </g>
  </svg>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const size = Number(p.get('size') || 192);
  const radius = Number(p.get('radius') || 0);
  const el = document.getElementById('icon');
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.style.borderRadius = radius + 'px';
  document.body.style.width = size + 'px';
  document.body.style.height = size + 'px';
</script>
</body>
</html>
