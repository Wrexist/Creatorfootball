name: iOS source qualification
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/game/**', 'packages/engine/**', 'pnpm-lock.yaml', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Verify native toolchain
        run: |
          xcodebuild -version
          swift --version
          test "$(xcodebuild -version | awk '/Xcode/ {split($2, v, "."); print v[1]}')" -ge 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @cf/game cap:sync
      - name: Build unsigned simulator app
        run: xcodebuild -project apps/game/ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath artifacts/ios CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-simulator-app
          path: artifacts/ios/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 7
