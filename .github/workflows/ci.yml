name: CI

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '31 6 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # No `version:` here on purpose: pnpm/action-setup reads the single
      # source of truth from package.json's "packageManager" field. Specifying
      # both makes the action fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The engine purity boundary is enforced here. If this step fails, a
      # domain module has reached for React, the DOM, a clock or Math.random.
      - name: Dependency advisories
        run: pnpm audit --audit-level=moderate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # A green build and a green unit suite are not evidence the app runs:
      # the bundle has failed to boot while both were passing. This drives the
      # real artefact in a real browser.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke test
        run: pnpm test:smoke
      - name: Mobile repair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-repair-evidence
          path: |
            artifacts/media-repair-20260923/*.png
            artifacts/media-repair-20260923/metrics.json
            artifacts/media-repair-20260923/matrix.json
            artifacts/media-repair-20260923/states.json
            artifacts/media-repair-20260923/failure.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Optional content presentation qualification
        run: node apps/game/e2e/paid-packs.mjs

  audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Balance and invariant audits run on every push. A change that inflates
      # the economy or breaks match realism should fail here, not in review.
      - name: Simulation and economy audits
        run: pnpm audit:all
