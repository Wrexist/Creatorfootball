name: Android source qualification
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/game/**', 'packages/engine/**', 'pnpm-lock.yaml', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @cf/game cap:sync
      - name: Build APK, unsigned release bundle and run Android lint
        working-directory: apps/game/android
        run: bash gradlew assembleDebug bundleRelease lintDebug lintRelease --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: creator-football-android-debug
          path: |
            apps/game/android/app/build/outputs/apk/debug/app-debug.apk
            apps/game/android/app/build/reports/lint-results-debug.html
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: creator-football-android-unsigned-qualification
          path: |
            apps/game/android/app/build/outputs/bundle/release/app-release.aab
            apps/game/android/app/build/reports/lint-results-release.html
          retention-days: 7
